name: Auto Convert WebP & Generate Wallpaper JSON

on:
  push:
    paths:
      - 'raw_images/**'
      - 'scripts/**'
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install Pillow

      - name: Run Processing Script
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/generate_wallpapers.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpapers/ wallpapers.json
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan baru untuk di-commit."
          else
            git commit -m "Auto-convert WebP and update wallpapers.json [skip ci]"
            git push
          fi
